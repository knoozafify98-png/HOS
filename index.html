<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Operations Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen flex flex-col pb-24 selection:bg-emerald-500 selection:text-white">

  <!-- 🚨 STICKY RED ALERT BANNER -->
  <div class="sticky top-0 z-50 bg-red-600 text-white px-4 py-2.5 shadow-md flex items-center justify-between animate-pulse">
    <div class="flex items-center space-x-2 text-xs md:text-sm font-bold">
      <i data-lucide="alert-triangle" class="w-5 h-5 text-yellow-300 shrink-0"></i>
      <span>🚨 ACTIVE ALLERGY ALERT: Room 304 - Severe Peanut & Shellfish Allergy!</span>
    </div>
    <span class="bg-red-800 text-white text-[10px] font-semibold px-2 py-1 rounded uppercase tracking-wider hidden sm:inline-block">High Priority</span>
  </div>

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-600 text-white p-2 rounded-xl shadow-sm">
        <i data-lucide="chef-hat" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg md:text-xl text-slate-800 tracking-tight leading-none">Kitchen Operations Hub</h1>
        <p class="text-xs text-slate-500 font-medium mt-0.5">Live Shift Management & SOPs</p>
      </div>
    </div>
    <div class="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center space-x-2 text-xs font-semibold text-slate-700">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span>Kitchen Live</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5" id="app-container">
    <!-- Dynamic views injected here -->
  </main>

  <!-- WHATSAPP-STYLE BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 shadow-lg px-2 py-2">
    <div class="max-w-4xl mx-auto grid grid-cols-6 gap-1">
      
      <!-- 1. Schedule -->
      <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 bg-[#DCFCE7] text-emerald-900 font-bold">
        <span class="text-xl mb-0.5">📅</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">Schedule</span>
      </button>

      <!-- 2. Daily Duties -->
      <button onclick="switchTab('duties')" id="nav-duties" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium">
        <span class="text-xl mb-0.5">📌</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">Daily Duties</span>
      </button>

      <!-- 3. SOPs -->
      <button onclick="switchTab('sops')" id="nav-sops" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium">
        <span class="text-xl mb-0.5">🥗</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">SOPs</span>
      </button>

      <!-- 4. Shift Feedback -->
      <button onclick="switchTab('feedback')" id="nav-feedback" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium">
        <span class="text-xl mb-0.5">📝</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">Feedback</span>
      </button>

      <!-- 5. Inventory -->
      <button onclick="switchTab('inventory')" id="nav-inventory" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium">
        <span class="text-xl mb-0.5">📦</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">Inventory</span>
      </button>

      <!-- 6. Handover -->
      <button onclick="switchTab('handover')" id="nav-handover" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium">
        <span class="text-xl mb-0.5">📋</span>
        <span class="text-[10px] sm:text-xs truncate w-full text-center">Handover</span>
      </button>

    </div>
  </nav>

  <!-- MODAL CONTAINER -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-150">
      <!-- Modal content inserted dynamically -->
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    // State Data
    let currentTab = 'schedule';
    let searchQuery = '';
    let guestCount = 10;
    let sopSubTab = 'morning';
    let inventoryTab = 'fridge';
    let feedbackType = 'good';
    let selectedIssues = [];
    let isAnonymous = false;
    let handoverCategory = 'complaints';

    let staffData = {
      morning: [
        { id: '1', name: 'Muhamed Mamdouh', role: 'Sous Chef', section: 'Hot' },
        { id: '2', name: 'Mustafa Magdy', role: 'Chef de Partie', section: 'Cold' },
        { id: '3', name: 'Muhamed Kamal', role: 'First Commis', section: 'Grill' },
        { id: '4', name: 'Hadeer Muhamed', role: 'Demi Chef', section: 'Buffet' },
        { id: '5', name: 'Muhamed Ahmed', role: 'Second Commis', section: 'Cold' },
        { id: '6', name: 'Kareem Ashraf', role: 'First Commis', section: 'Hot' },
        { id: '7', name: 'Sameh Sameer', role: 'Demi Chef', section: 'Grill' }
      ],
      afternoon: [
        { id: '8', name: 'Islam Anwar', role: 'Chef de Partie', section: 'Hot' },
        { id: '9', name: 'Eid Muhamed', role: 'First Commis', section: 'Grill' },
        { id: '10', name: 'Taher Ahmed', role: 'Demi Chef', section: 'Cold' },
        { id: '11', name: 'Hamdy Osama', role: 'Second Commis', section: 'Buffet' },
        { id: '12', name: 'Ayman Salah', role: 'First Commis', section: 'Hot' },
        { id: '13', name: 'Muhamed Mustafa', role: 'Chef de Partie', section: 'Grill' }
      ],
      night: [
        { id: '14', name: 'Islam Muhamed', role: 'Chef de Partie', section: 'Hot' },
        { id: '15', name: 'Hassan Ahmed', role: 'First Commis', section: 'Cold' },
        { id: '16', name: 'Aashour', role: 'Demi Chef', section: 'Buffet' },
        { id: '17', name: 'Islam Ahmed', role: 'Second Commis', section: 'Grill' }
      ]
    };

    let dutyCards = [
      { id: 'd1', title: 'High Tea Stand', type: 'High Tea', image: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&q=80&w=800', desc: 'Foccacia salmon sandwich pieces, tortilla stuffed with cream cheese and roasted beef, panini bread stuffed turkey, brown toast stuffed cheddar cheese' },
      { id: 'd2', title: 'Executive Cheese Board', type: 'Buffet', image: 'https://images.unsplash.com/photo-1631379578550-7038263db699?auto=format&fit=crop&q=80&w=800', desc: 'Selection of Aged Cheddar, French Brie, Gouda, Blue Cheese, Crackers, Dried Figs, Grapes & Nuts' },
      { id: 'd3', title: 'Classic Caesar Salad', type: 'Set Menu', image: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&q=80&w=800', desc: 'Crisp Romaine lettuce, shaved Parmesan, garlic herb croutons, poached chicken breast & house Caesar dressing' },
      { id: 'd4', title: 'Gourmet Breakfast Box', type: 'Breakfast Boxes', image: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&q=80&w=800', desc: 'Box contains apple, banana, jam & honey portion, croissant, danish, rolls and mini sandwich' }
    ];

    let inventoryData = {
      storage: [
        { name: 'Panini Bread', qty: '40 loaves', expiry: '2026-09-15', status: 'yellow', allergens: ['Gluten'] },
        { name: 'Brown Toast', qty: '15 packs', expiry: '2026-09-11', status: 'yellow', allergens: ['Gluten'] }
      ],
      fridge: [
        { name: 'Smoked Salmon Slices', qty: '2.5 kg', expiry: '2026-09-10', status: 'red', allergens: ['Fish'] },
        { name: 'Cream Cheese', qty: '4 kg', expiry: '2026-09-12', status: 'yellow', allergens: ['Dairy'] },
        { name: 'Sous-vide Chicken', qty: '8.5 kg', expiry: '2026-09-11', status: 'yellow', allergens: [] }
      ],
      freezer: [
        { name: 'Croissants Dough', qty: '200 pcs', expiry: '2026-10-15', status: 'green', allergens: ['Gluten', 'Dairy'] },
        { name: 'Ice Cream Base', qty: '5 tubs', expiry: '2026-09-10', status: 'red', allergens: ['Dairy', 'Nuts'] }
      ]
    };

    let feedbackLogs = [
      { type: 'good', comment: 'Morning shift finished prep 30 mins early!', time: '11:30 AM', chef: 'Muhamed Mamdouh', issues: [] },
      { type: 'bad', comment: 'Grill Unit #2 temperature fluctuation.', time: '03:15 PM', chef: 'Anonymous', issues: ['Equipment & Tools'] }
    ];

    let handovers = {
      complaints: [{ text: 'Room 210 reported Caesar Salad was slightly over-salted.', time: '14:20', chef: 'Islam A.' }],
      mistakes: [{ text: 'Burned 1 batch of panini bread during afternoon rush.', time: '15:45', chef: 'Hamdy O.' }],
      requests: [{ text: 'VIP Table 4 requested gluten-free rolls for tomorrow high tea.', time: '16:00', chef: 'Muhamed M.' }]
    };

    let clubSandwichImg = 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&q=80&w=800';

    // Switch Navigation Tab
    function switchTab(tab) {
      currentTab = tab;
      // Update nav styles
      ['schedule', 'duties', 'sops', 'feedback', 'inventory', 'handover'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.className = "flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 bg-[#DCFCE7] text-emerald-900 font-bold shadow-xs";
        } else {
          btn.className = "flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all duration-200 text-slate-600 hover:bg-slate-100 font-medium";
        }
      });
      render();
    }

    // Render View based on activeTab
    function render() {
      const container = document.getElementById('app-container');
      lucide.createIcons();

      if (currentTab === 'schedule') {
        container.innerHTML = renderSchedule();
      } else if (currentTab === 'duties') {
        container.innerHTML = renderDuties();
      } else if (currentTab === 'sops') {
        container.innerHTML = renderSOPs();
      } else if (currentTab === 'feedback') {
        container.innerHTML = renderFeedback();
      } else if (currentTab === 'inventory') {
        container.innerHTML = renderInventory();
      } else if (currentTab === 'handover') {
        container.innerHTML = renderHandover();
      }
      lucide.createIcons();
    }

    // 1. SCHEDULE VIEW
    function renderSchedule() {
      const totalCount = staffData.morning.length + staffData.afternoon.length + staffData.night.length;
      
      const filterList = (list) => {
        if (!searchQuery.trim()) return list;
        const q = searchQuery.toLowerCase();
        return list.filter(s => s.name.toLowerCase().includes(q) || s.role.toLowerCase().includes(q) || s.section.toLowerCase().includes(q));
      };

      const renderCard = (staff, shiftKey) => {
        const badgeColors = {
          'Cold': 'bg-blue-100 text-blue-800 border-blue-200',
          'Hot': 'bg-red-100 text-red-800 border-red-200',
          'Grill': 'bg-orange-100 text-orange-800 border-orange-200',
          'Buffet': 'bg-amber-100 text-amber-800 border-amber-200'
        }[staff.section] || 'bg-slate-100 text-slate-800 border-slate-200';

        let moveButtons = '';
        if (shiftKey !== 'morning') moveButtons += `<button onclick="moveStaff('${staff.id}', '${shiftKey}', 'morning')" class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">🌅 Morning</button>`;
        if (shiftKey !== 'afternoon') moveButtons += `<button onclick="moveStaff('${staff.id}', '${shiftKey}', 'afternoon')" class="text-[10px] bg-orange-100 text-orange-800 px-1.5 py-0.5 rounded font-bold">☀️ Afternoon</button>`;
        if (shiftKey !== 'night') moveButtons += `<button onclick="moveStaff('${staff.id}', '${shiftKey}', 'night')" class="text-[10px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded font-bold">🌙 Night</button>`;

        return `
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-xs space-y-2">
            <div class="flex items-start justify-between">
              <div>
                <div class="font-bold text-slate-800 text-sm">${staff.name}</div>
                <div class="text-xs text-slate-500 font-medium">${staff.role}</div>
              </div>
              <span class="px-2 py-0.5 text-[10px] font-extrabold rounded-full border ${badgeColors}">${staff.section}</span>
            </div>
            <div class="flex items-center space-x-1 pt-1 border-t border-slate-200 flex-wrap gap-1">
              <span class="text-[10px] text-slate-400 font-semibold mr-1">Move to:</span>
              ${moveButtons}
            </div>
          </div>
        `;
      };

      return `
        <div class="space-y-5">
          <!-- Metrics -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-slate-100 text-slate-800 rounded-lg"><i data-lucide="users" class="w-6 h-6"></i></div>
              <div><div class="text-2xl font-black text-slate-800">${totalCount}</div><div class="text-xs font-bold text-slate-500 uppercase">Total Staff</div></div>
            </div>
            <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-amber-100 text-amber-800 rounded-lg"><span class="text-lg">🌅</span></div>
              <div><div class="text-2xl font-black text-amber-900">${staffData.morning.length}</div><div class="text-xs font-bold text-amber-700 uppercase">Morning</div></div>
            </div>
            <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-orange-100 text-orange-800 rounded-lg"><span class="text-lg">☀️</span></div>
              <div><div class="text-2xl font-black text-orange-900">${staffData.afternoon.length}</div><div class="text-xs font-bold text-orange-700 uppercase">Afternoon</div></div>
            </div>
            <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-indigo-100 text-indigo-800 rounded-lg"><span class="text-lg">🌙</span></div>
              <div><div class="text-2xl font-black text-indigo-900">${staffData.night.length}</div><div class="text-xs font-bold text-indigo-700 uppercase">Night</div></div>
            </div>
          </div>

          <!-- Search -->
          <div class="relative">
            <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" placeholder="Search staff by Name, Job Title, or Section (Hot, Cold, Grill, Buffet)..." value="${searchQuery}" oninput="searchQuery=this.value; render()" class="w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm text-sm" />
          </div>

          <!-- Shift Columns -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Morning -->
            <div class="bg-white rounded-2xl border-2 border-amber-200 p-4 shadow-sm flex flex-col min-h-[400px]">
              <div class="flex items-center justify-between pb-3 mb-3 border-b border-amber-100">
                <div class="flex items-center space-x-2"><span class="text-xl">🌅</span><h3 class="font-bold text-slate-800">Morning Shift</h3></div>
                <span class="bg-amber-100 text-amber-800 text-xs font-extrabold px-2.5 py-1 rounded-full">${filterList(staffData.morning).length}</span>
              </div>
              <div class="space-y-2.5 flex-1">${filterList(staffData.morning).map(s => renderCard(s, 'morning')).join('')}</div>
            </div>
            <!-- Afternoon -->
            <div class="bg-white rounded-2xl border-2 border-orange-200 p-4 shadow-sm flex flex-col min-h-[400px]">
              <div class="flex items-center justify-between pb-3 mb-3 border-b border-orange-100">
                <div class="flex items-center space-x-2"><span class="text-xl">☀️</span><h3 class="font-bold text-slate-800">Afternoon Shift</h3></div>
                <span class="bg-orange-100 text-orange-800 text-xs font-extrabold px-2.5 py-1 rounded-full">${filterList(staffData.afternoon).length}</span>
              </div>
              <div class="space-y-2.5 flex-1">${filterList(staffData.afternoon).map(s => renderCard(s, 'afternoon')).join('')}</div>
            </div>
            <!-- Night -->
            <div class="bg-white rounded-2xl border-2 border-indigo-200 p-4 shadow-sm flex flex-col min-h-[400px]">
              <div class="flex items-center justify-between pb-3 mb-3 border-b border-indigo-100">
                <div class="flex items-center space-x-2"><span class="text-xl">🌙</span><h3 class="font-bold text-slate-800">Night Shift</h3></div>
                <span class="bg-indigo-100 text-indigo-800 text-xs font-extrabold px-2.5 py-1 rounded-full">${filterList(staffData.night).length}</span>
              </div>
              <div class="space-y-2.5 flex-1">${filterList(staffData.night).map(s => renderCard(s, 'night')).join('')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function moveStaff(id, source, target) {
      let member = null;
      staffData[source] = staffData[source].filter(s => {
        if (s.id === id) { member = s; return false; }
        return true;
      });
      if (member) staffData[target].push(member);
      render();
    }

    // 2. DAILY DUTIES VIEW
    function renderDuties() {
      const stands = Math.ceil(guestCount / 5);
      const boards = Math.ceil(guestCount / 10);
      const salads = guestCount;
      const boxes = guestCount;

      return `
        <div class="space-y-6">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-800">📌 Dynamic Headcount Equipment Calculator</h2>
              <p class="text-xs text-slate-500 font-medium mt-0.5">Automatically scales stands, boards, and ingredients based on daily guest volume.</p>
            </div>
            <div class="flex items-center space-x-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
              <span class="text-xs font-bold text-slate-700">Guest Headcount:</span>
              <input type="number" min="1" max="500" value="${guestCount}" onchange="guestCount=parseInt(this.value)||1; render()" class="w-20 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-center font-black text-emerald-700 text-base focus:outline-none" />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${dutyCards.map(d => `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div class="relative h-48 sm:h-56 bg-slate-100">
                  <img src="${d.image}" alt="${d.title}" class="w-full h-full object-cover" />
                  <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-xs text-white text-xs font-bold px-3 py-1 rounded-full">${d.type}</div>
                  <button onclick="openImagePrompt('${d.id}')" class="absolute bottom-3 right-3 bg-white/90 hover:bg-white text-slate-800 p-2 rounded-xl shadow font-semibold text-xs flex items-center space-x-1">
                    <i data-lucide="image" class="w-4 h-4"></i><span>Change Photo</span>
                  </button>
                </div>
                <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                  <div>
                    <h3 class="font-extrabold text-lg text-slate-800 mb-2">${d.title}</h3>
                    <p class="text-xs text-slate-600 leading-relaxed font-medium bg-slate-50 p-3 rounded-xl border border-slate-100">${d.desc}</p>
                  </div>
                  <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center justify-between text-xs font-bold text-emerald-900">
                    <span>Required for ${guestCount} Guests:</span>
                    <span class="bg-emerald-600 text-white px-2.5 py-1 rounded-lg">
                      ${d.type === 'High Tea' ? `${stands} Stand(s)` : d.type === 'Buffet' ? `${boards} Cheese Board(s)` : `${salads} Portions`}
                    </span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 3. SOPS VIEW
    function renderSOPs() {
      return `
        <div class="space-y-5">
          <div class="flex space-x-2 border-b border-slate-200 pb-3">
            <button onclick="sopSubTab='morning'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${sopSubTab === 'morning' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">🌅 Morning (Mise en Place)</button>
            <button onclick="sopSubTab='afternoon'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${sopSubTab === 'afternoon' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">☀️ Afternoon (Plating)</button>
            <button onclick="sopSubTab='night'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${sopSubTab === 'night' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">🌙 Night (Buffet Setup)</button>
          </div>

          ${sopSubTab === 'morning' ? `
            <div class="space-y-5">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="relative h-48 rounded-xl overflow-hidden bg-slate-100">
                  <img src="${clubSandwichImg}" class="w-full h-full object-cover" />
                  <button onclick="openImagePrompt('club')" class="absolute bottom-2 right-2 bg-black/70 text-white p-1.5 rounded-lg text-xs">Edit Photo</button>
                </div>
                <div class="md:col-span-2 space-y-3">
                  <h3 class="font-extrabold text-lg text-slate-800">Club Sandwich Dressing Prep & Recipe</h3>
                  <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-xs font-medium text-slate-700">
                    <div class="font-bold text-slate-900 border-b pb-1">Ingredient Specs:</div>
                    <p>• 500g Mayonnaise</p>
                    <p>• 30g Dijon Mustard</p>
                    <p>• 5ml Fresh Lemon Juice</p>
                    <p>• Pinch of Sea Salt & Cracked Black Pepper</p>
                  </div>
                  <div class="flex space-x-2 pt-2">
                    <button onclick="openModal('photo', '${clubSandwichImg}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold flex items-center space-x-1.5">
                      <i data-lucide="eye" class="w-4 h-4"></i><span>View Photo Modal</span>
                    </button>
                    <button onclick="openModal('video', '')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-lg text-xs font-bold flex items-center space-x-1.5">
                      <i data-lucide="play" class="w-4 h-4"></i><span>Watch Video SOP</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                <h3 class="font-extrabold text-base text-slate-800">Protein Prep & Temperature Checks</h3>
                <div class="p-4 bg-amber-50/50 border border-amber-200 rounded-xl text-xs text-amber-900 font-medium leading-relaxed">
                  <strong>Sous-vide Chicken Breast:</strong> Cook precisely at 65°C for 4 hours. Chill rapidly, then slice exactly at 4mm thickness before assembly.
                </div>
              </div>
            </div>
          ` : sopSubTab === 'afternoon' ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-5">
              <h3 class="font-extrabold text-lg text-slate-800">Club Sandwich Assembly & Plating Specifications</h3>
              <div class="space-y-4 text-xs font-medium text-slate-700">
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                  <strong class="text-slate-900">Step 1: Toasting</strong><br/>Toast 3 slices of toast bread to golden brown, lightly spread dressing on each slice.
                </div>
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                  <strong class="text-slate-900">Step 2: Layering</strong><br/>Layer 1: Iceberg lettuce, 4 sliced tomatoes, one slice cheddar piece, 2 slices grilled bacon.<br/>Layer 2: 4 chicken breast slices and omelette.
                </div>
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                  <strong class="text-slate-900">Step 3: Pressing & Cutting</strong><br/>After pressing on sandwich maker, trim crusts and cut into 4 equal triangles. Serve with olives & iceberg lettuce with one cherry tomato in master pots.
                </div>
              </div>
              <button onclick="openModal('photo', '${clubSandwichImg}')" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-sm">View Plating Photo Modal</button>
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
              <h3 class="font-extrabold text-lg text-slate-800">Night Shift Breakfast Buffet Prep & Setup</h3>
              <p class="text-xs text-slate-600 leading-relaxed font-medium">Verify all chafing dishes, temperature logs (above 65°C hot holding), and replenish fresh bakery displays prior to 06:00 AM breakfast service.</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <img src="https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&q=80&w=800" class="rounded-xl h-40 object-cover w-full border" />
                <img src="https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&q=80&w=800" class="rounded-xl h-40 object-cover w-full border" />
              </div>
            </div>
          `}
        </div>
      `;
    }

    // 4. SHIFT FEEDBACK VIEW
    function renderFeedback() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="lg:col-span-1 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h3 class="font-extrabold text-base text-slate-800">📝 Log Shift Feedback</h3>
            
            <div class="flex space-x-2">
              <button onclick="feedbackType='good'; render()" class="flex-1 py-2 rounded-xl text-xs font-bold border transition ${feedbackType==='good' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-300'}">👍 Good Shift</button>
              <button onclick="feedbackType='bad'; render()" class="flex-1 py-2 rounded-xl text-xs font-bold border transition ${feedbackType==='bad' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 border-slate-300'}">👎 Issues / Bad</button>
            </div>

            ${feedbackType === 'bad' ? `
              <div class="space-y-3 pt-2">
                <label class="text-xs font-bold text-slate-700 block">Select Issue Chips:</label>
                <div class="flex flex-wrap gap-2">
                  ${['Shift Issue', 'Overtime', 'Equipment & Tools'].map(issue => `
                    <button onclick="toggleIssue('${issue}')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${selectedIssues.includes(issue) ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-100 text-slate-700 border-slate-200'}">${issue}</button>
                  `).join('')}
                </div>

                ${selectedIssues.includes('Equipment & Tools') ? `
                  <div>
                    <label class="text-xs font-bold text-slate-700 block mb-1">Equipment Issue:</label>
                    <select id="eq-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium">
                      <option>Grill Unit #2 - Temperature Fluctuation</option>
                      <option>Combi Oven #1 - Steam Valve Error</option>
                      <option>Dishwasher - Low Water Pressure</option>
                    </select>
                  </div>
                ` : ''}
              </div>
            ` : ''}

            <div>
              <label class="text-xs font-bold text-slate-700 block mb-1">Comments / Details:</label>
              <textarea id="fb-comment" rows="3" placeholder="Describe shift performance..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium focus:outline-none"></textarea>
            </div>

            <div class="flex items-center justify-between pt-1">
              <span class="text-xs font-bold text-slate-700">Anonymous Mode</span>
              <input type="checkbox" id="anon-check" ${isAnonymous ? 'checked' : ''} onchange="isAnonymous=this.checked" class="w-4 h-4 accent-emerald-600 cursor-pointer" />
            </div>

            <button onclick="submitFeedback()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-sm transition">Submit Shift Log</button>
          </div>

          <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h3 class="font-extrabold text-base text-slate-800">Shift Log History</h3>
            <div class="space-y-3">
              ${feedbackLogs.map(log => `
                <div class="p-4 rounded-xl border ${log.type === 'good' ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/50 border-red-200'} space-y-2">
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-bold ${log.type === 'good' ? 'text-emerald-800' : 'text-red-800'}">${log.type === 'good' ? '👍 Successful Shift' : '⚠️ Issue Reported'}</span>
                    <span class="text-slate-500 font-medium">${log.time} • Chef: ${log.chef}</span>
                  </div>
                  ${log.issues && log.issues.length > 0 ? `<div class="flex gap-1">${log.issues.map(i => `<span class="bg-red-200 text-red-900 px-2 py-0.5 rounded text-[10px] font-bold">${i}</span>`).join('')}</div>` : ''}
                  ${log.equipment ? `<div class="text-xs text-red-700 font-bold">🔧 ${log.equipment}</div>` : ''}
                  <p class="text-xs text-slate-700 font-medium">${log.comment}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function toggleIssue(issue) {
      if (selectedIssues.includes(issue)) {
        selectedIssues = selectedIssues.filter(i => i !== issue);
      } else {
        selectedIssues.push(issue);
      }
      render();
    }

    function submitFeedback() {
      const comment = document.getElementById('fb-comment').value;
      const eqSelect = document.getElementById('eq-select');
      const newLog = {
        type: feedbackType,
        issues: [...selectedIssues],
        equipment: eqSelect ? eqSelect.value : '',
        comment: comment || 'No comment provided.',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        chef: isAnonymous ? 'Anonymous' : 'Senior Chef'
      };
      feedbackLogs.unshift(newLog);
      selectedIssues = [];
      render();
    }

    // 5. INVENTORY VIEW
    function renderInventory() {
      const currentList = inventoryData[inventoryTab];

      return `
        <div class="space-y-5">
          <div class="flex space-x-2 border-b border-slate-200 pb-3">
            <button onclick="inventoryTab='storage'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${inventoryTab==='storage'?'bg-emerald-600 text-white shadow-sm':'bg-white text-slate-600 border border-slate-200'}">📦 Dry Storage Room</button>
            <button onclick="inventoryTab='fridge'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${inventoryTab==='fridge'?'bg-emerald-600 text-white shadow-sm':'bg-white text-slate-600 border border-slate-200'}">❄️ Refrigerator</button>
            <button onclick="inventoryTab='freezer'; render()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${inventoryTab==='freezer'?'bg-emerald-600 text-white shadow-sm':'bg-white text-slate-600 border border-slate-200'}">🧊 Freezer</button>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h3 class="font-extrabold text-base text-slate-800 capitalize">${inventoryTab} Inventory & FIFO Expiry Tracking</h3>
            
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-slate-200 text-slate-400 font-bold">
                    <th class="py-3 px-3">Item Name</th>
                    <th class="py-3 px-3">Quantity</th>
                    <th class="py-3 px-3">Expiry Date (FIFO)</th>
                    <th class="py-3 px-3">Allergens</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                  ${currentList.map(item => {
                    const badgeClass = item.status === 'red' ? 'bg-red-100 text-red-800 border-red-200' : item.status === 'yellow' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200';
                    return `
                      <tr class="hover:bg-slate-50">
                        <td class="py-3 px-3 font-bold text-slate-900">${item.name}</td>
                        <td class="py-3 px-3">${item.qty}</td>
                        <td class="py-3 px-3"><span class="px-2.5 py-1 rounded-full border text-[10px] font-extrabold ${badgeClass}">${item.expiry} (${item.status === 'red' ? 'Expired/Today' : item.status === 'yellow' ? 'Expiring Soon' : 'Fresh'})</span></td>
                        <td class="py-3 px-3"><div class="flex gap-1">${item.allergens.map(a => `<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-[10px] font-bold border border-purple-200">${a}</span>`).join('')}</div></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // 6. HANDOVER VIEW
    function renderHandover() {
      return `
        <div class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Complaints -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
              <h4 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2"><span>💬</span><span>Guest Complaints</span></h4>
              <div class="space-y-2">
                ${handovers.complaints.map(h => `<div class="p-3 bg-slate-50 rounded-xl border text-xs"><div class="text-slate-500 text-[10px] mb-1">${h.time} • ${h.chef}</div><p class="text-slate-800 font-medium">${h.text}</p></div>`).join('')}
              </div>
            </div>
            <!-- Mistakes -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
              <h4 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2"><span>⚠️</span><span>Kitchen Mistakes</span></h4>
              <div class="space-y-2">
                ${handovers.mistakes.map(h => `<div class="p-3 bg-red-50/50 rounded-xl border border-red-200 text-xs"><div class="text-slate-500 text-[10px] mb-1">${h.time} • ${h.chef}</div><p class="text-slate-800 font-medium">${h.text}</p></div>`).join('')}
              </div>
            </div>
            <!-- Requests -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
              <h4 class="font-extrabold text-sm text-slate-800 flex items-center space-x-2"><span>⭐</span><span>Special Requests</span></h4>
              <div class="space-y-2">
                ${handovers.requests.map(h => `<div class="p-3 bg-emerald-50/50 rounded-xl border border-emerald-200 text-xs"><div class="text-slate-500 text-[10px] mb-1">${h.time} • ${h.chef}</div><p class="text-slate-800 font-medium">${h.text}</p></div>`).join('')}
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
            <h3 class="font-extrabold text-base text-slate-800">Add Shift Handover Note</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <select id="ho-cat" class="p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold">
                <option value="complaints">Guest Complaint</option>
                <option value="mistakes">Kitchen Mistake</option>
                <option value="requests">Special Request</option>
              </select>
              <input type="text" id="ho-text" placeholder="Type handover note..." class="sm:col-span-2 p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium" />
            </div>
            <button onclick="addHandover()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Add Note</button>
          </div>
        </div>
      `;
    }

    function addHandover() {
      const cat = document.getElementById('ho-cat').value;
      const text = document.getElementById('ho-text').value;
      if (!text.trim()) return;
      handovers[cat].unshift({ text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), chef: 'Senior Duty Chef' });
      render();
    }

    // Modal helpers
    function openModal(type, url) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');

      if (type === 'photo') {
        content.innerHTML = `
          <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-slate-800">Photo Presentation Viewer</h3><button onclick="closeModal()" class="text-slate-500 font-bold">✕</button></div>
          <img src="${url}" class="w-full h-72 object-cover rounded-xl border" />
        `;
      } else if (type === 'video') {
        content.innerHTML = `
          <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-slate-800">Club Sandwich SOP Video Tutorial</h3><button onclick="closeModal()" class="text-slate-500 font-bold">✕</button></div>
          <div class="bg-black rounded-xl h-64 flex flex-col items-center justify-center text-white space-y-2">
            <i data-lucide="play-circle" class="w-16 h-16 text-emerald-400"></i>
            <p class="text-xs font-medium">Playing Kitchen Training Video Simulation</p>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function openImagePrompt(key) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');

      content.innerHTML = `
        <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-slate-800">Change Presentation Image URL</h3><button onclick="closeModal()" class="text-slate-500 font-bold">✕</button></div>
        <p class="text-xs text-slate-500 mb-3">Paste a direct image link from Unsplash or your image host below:</p>
        <input type="text" id="new-img-url" placeholder="https://images.unsplash.com/..." class="w-full p-3 bg-slate-50 border rounded-xl text-xs mb-4" />
        <button onclick="saveImage('${key}')" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Update Image</button>
      `;
    }

    function saveImage(key) {
      const url = document.getElementById('new-img-url').value;
      if (!url.trim()) return;
      if (key === 'club') {
        clubSandwichImg = url;
      } else {
        const item = dutyCards.find(d => d.id === key);
        if (item) item.image = url;
      }
      closeModal();
      render();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('flex');
      backdrop.classList.add('hidden');
    }

    // Initial load
    render();
  </script>
</body>
</html>
